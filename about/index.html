<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אורי פלד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1220;--ink:#15233b;--accent:#0aa8d6;--radius:18px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
  body{position:relative;direction:ltr}
  .deck{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:center center;direction:rtl}
  .slide{position:absolute;inset:0;padding:44px 40px 60px;display:none;align-items:center;justify-content:center}
  .slide.active{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* slide 1: waving avatar */
  .avatar{position:relative;width:560px;height:560px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.5))}
  .avatar img{position:absolute;display:block;user-select:none;-webkit-user-drag:none}
  .avatar .body{left:0;top:0;width:100%;height:100%}
  /* hand layer: crop 180x160 at (90,440) of the 796px source; wrist at about (200,590) */
  .avatar .hand{left:11.3%;top:55.3%;width:22.6%;height:20.1%;transform-origin:61% 94%;animation:wave 2.6s ease-in-out infinite}
  @keyframes wave{
    0%,8%{transform:rotate(0)}
    16%{transform:rotate(14deg)}
    24%{transform:rotate(-9deg)}
    32%{transform:rotate(12deg)}
    40%{transform:rotate(-6deg)}
    48%{transform:rotate(8deg)}
    56%,100%{transform:rotate(0)}
  }
  .avatar .body{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,8%,56%,100%{transform:rotate(0)}22%{transform:rotate(-1.4deg)}40%{transform:rotate(1deg)}}

  /* slide 2: things built in free time */
  .mosaic{display:grid;width:100%;height:100%;gap:16px;direction:ltr}
  .mosaic figure{margin:0;overflow:hidden;border-radius:var(--radius);background:#1a2540;box-shadow:0 20px 50px rgba(0,0,0,.35);opacity:0;transform:translateY(14px) scale(.98);animation:pop .55s cubic-bezier(.2,.8,.3,1) forwards}
  .mosaic img{width:100%;height:100%;display:block;object-fit:cover}
  .mosaic figure:nth-child(2){animation-delay:.15s}
  .mosaic figure:nth-child(3){animation-delay:.3s}
  /* same arrangement as the original slides: one row, equal heights, each photo whole at its own aspect ratio */
  .treehouse,.furniture{display:flex;align-items:center;justify-content:center;gap:16px;height:100%}
  .treehouse figure,.furniture figure{flex:0 0 auto}
  .treehouse figure{height:600px}
  .furniture figure{height:338px}
  .treehouse img,.furniture img{height:100%;width:auto;object-fit:unset}
  @keyframes pop{to{opacity:1;transform:none}}

  /* hud */
  .hud{position:absolute;left:0;right:0;bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.55);font-size:14px}
  .hud .dots{display:flex;gap:6px;direction:ltr}
  .hud .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer}
  .hud .dot.cur{background:var(--accent);transform:scale(1.25)}
  .hud .fs{position:absolute;right:24px;top:-8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);font-size:18px;line-height:1;padding:5px 9px;border-radius:8px;cursor:pointer}
  .hud .fs:hover{background:rgba(255,255,255,.18)}
  a.back{position:absolute;bottom:8px;left:24px;color:rgba(255,255,255,.6);text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;direction:rtl}
  a.back:hover{color:#fff;border-color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<div class="deck" id="deck">
  <section class="slide active" id="s1">
    <div class="avatar">
      <img class="body" src="img/hi-body.png" alt="אורי מנופף לשלום">
      <img class="hand" src="img/hi-hand.png" alt="">
    </div>
  </section>
  <section class="slide" id="s2">
    <div class="mosaic treehouse">
      <figure><img src="img/treehouse-front.jpg" alt="בית עץ על עמודים עם מרפסת וסולם, מבט מלפנים"></figure>
      <figure><img src="img/treehouse-side.jpg" alt="בית העץ, מבט מהצד עם הנדנדה"></figure>
    </div>
  </section>
  <section class="slide" id="s3">
    <div class="mosaic furniture">
      <figure class="f1"><img src="img/coffee-table.jpg" alt="שולחן סלון מעץ עם שיבוץ גאומטרי ומסגרת מתכת שחורה"></figure>
      <figure class="f2"><img src="img/drum-stool.jpg" alt="הדום מרופד שנבנה מתוף של מכונת כביסה"></figure>
      <figure class="f3"><img src="img/spiral-table.jpg" alt="שולחן עגול על רגל ספירלית מעץ"></figure>
    </div>
  </section>
  <a class="back" href="../">לשיעורים ←</a>
  <div class="hud">
    <div class="dots" id="dots"></div>
    <button class="fs" id="fs" title="מסך מלא">⛶</button>
  </div>
</div>
<script>
const slides=[...document.querySelectorAll('.slide')];let cur=0;
const dots=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('span');d.className='dot';d.onclick=()=>go(i);dots.appendChild(d);});
function go(i){cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('active',j===cur));
  // restart the mosaic entrance each time the slide is shown
  const m=slides[cur].querySelector('.mosaic');if(m){m.style.display='none';void m.offsetWidth;m.style.display='';}
  [...dots.children].forEach((d,j)=>d.classList.toggle('cur',j===cur));}
function next(){go(cur+1)}function prev(){go(cur-1)}
document.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='f'||e.key==='F'){toggleFs();}});
document.getElementById('deck').addEventListener('click',e=>{if(e.target.closest('a,button,.dot'))return;next();});
function toggleFs(){const el=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{const req=el.requestFullscreen||el.webkitRequestFullscreen;if(req)req.call(el).catch?.(()=>{});}}
document.getElementById('fs').onclick=toggleFs;
function fit(){const s=Math.min(window.innerWidth/1280,window.innerHeight/720);document.getElementById('deck').style.transform=`scale(${s})`;}
window.addEventListener('resize',fit);fit();go(0);
</script>
</body>
</html>
